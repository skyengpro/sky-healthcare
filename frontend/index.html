<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="description" content="Medicine stock and patient care for health centers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Healthcare" />
    <link rel="icon" type="image/png" href="/assets/sky_healthcare/frontend/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/sky_healthcare/frontend/apple-touch-icon.png" />
    <title>Healthcare Management</title>
    <script>
      // set the theme before the first paint, so a dark device never flashes white
      try {
        var m = localStorage.getItem('sky_healthcare.theme') || 'system'
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
